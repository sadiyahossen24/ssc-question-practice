<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapters — SSC Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #121212;
      --paper: #F5F2E8;
      --yellow: #EEFF3F;
      --coral: #FF5C3E;
      --grey: #8B8B85;

      --app-width: 400px;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--ink);
      color: var(--ink);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: var(--app-width);
      min-height: 100vh;
      background: var(--ink);
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 480px) {
      body { padding: 32px 16px; align-items: flex-start; }
      .app-shell {
        min-height: 780px;
        max-height: 860px;
        border-radius: 20px;
        overflow: hidden;
        border: 2px solid var(--ink);
        box-shadow: 8px 8px 0 var(--yellow);
      }
    }

    /* App bar with back button */
    .app-bar {
      flex: 0 0 auto;
      padding: 16px 18px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-bottom: 2px solid var(--paper);
    }

    .back-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--paper);
      border: 2px solid var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      text-decoration: none;
    }

    .back-btn svg { width: 16px; height: 16px; stroke: var(--ink); }

    .app-bar-title {
      font-weight: 900;
      font-size: 0.98rem;
      letter-spacing: -0.01em;
      color: var(--paper);
      text-transform: uppercase;
    }

    .app-bar-sub {
      font-size: 0.66rem;
      color: var(--grey);
      margin-top: 1px;
    }

    .app-content {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 20px 18px 14px;
    }

    .section-title {
      font-weight: 900;
      font-size: 0.86rem;
      margin: 0 0 12px;
      color: var(--paper);
      text-transform: uppercase;
      letter-spacing: 0.01em;
    }

    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chapter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 12px;
      text-decoration: none;
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .chapter-row:hover,
    .chapter-row:focus-visible {
      transform: translate(4px, 4px);
      box-shadow: 0 0 0 var(--ink);
      outline: none;
    }

    .chapter-num {
      font-weight: 900;
      font-size: 0.72rem;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--yellow);
      border: 2px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .chapter-text {
      flex: 1 1 auto;
      min-width: 0;
    }

    .chapter-name {
      font-weight: 700;
      font-size: 0.84rem;
      text-transform: uppercase;
      letter-spacing: 0.01em;
    }

    .chapter-meta {
      font-size: 0.66rem;
      color: var(--grey);
      font-weight: 500;
      margin-top: 1px;
    }

    .chapter-arrow { flex: 0 0 auto; }
    .chapter-arrow svg { width: 16px; height: 16px; stroke: var(--ink); }

    .note {
      font-size: 0.64rem;
      color: var(--grey);
      margin: 16px 2px 0;
      text-align: center;
      font-weight: 500;
    }

    .note strong { color: var(--coral); }

    .not-found {
      text-align: center;
      padding: 40px 10px;
      color: var(--paper);
    }

    .not-found p {
      font-size: 0.8rem;
      color: var(--grey);
      margin: 8px 0 18px;
    }

    .not-found a {
      display: inline-block;
      background: var(--yellow);
      color: var(--ink);
      font-weight: 800;
      font-size: 0.78rem;
      text-transform: uppercase;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 10px;
      border: 2px solid var(--ink);
    }

    /* Bottom tab bar */
    .tab-bar {
      flex: 0 0 auto;
      display: flex;
      border-top: 2px solid var(--paper);
    }

    .tab-item {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 10px 0;
      font-size: 0.58rem;
      font-weight: 700;
      color: var(--grey);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      text-decoration: none;
    }

    .tab-item svg { display: block; width: 18px; height: 18px; }

    .tab-item.is-active { color: var(--yellow); }

    .tab-item.is-active::before {
      content: "";
      position: absolute;
      top: 0;
      width: 24px;
      height: 3px;
      background: var(--yellow);
    }

    .tab-item.is-disabled { opacity: 0.4; pointer-events: none; }
  </style>
</head>
<body>

  <div class="app-shell">

    <header class="app-bar">
      <a href="index.html" class="back-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 5L8 12L15 19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <div>
        <div class="app-bar-title" id="subjectTitle">Subject</div>
        <div class="app-bar-sub" id="subjectTagline">Choose a chapter to practice</div>
      </div>
    </header>

    <main class="app-content" id="appContent">
      <!-- filled in by JS below -->
    </main>

    <nav class="tab-bar">
      <a href="index.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 11L12 4L20 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 10V19C6 19.55 6.45 20 7 20H17C17.55 20 18 19.55 18 19V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </a>
      <span class="tab-item is-active">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 4.5H15.5L19 8V19.5H5V4.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M8.5 10.5H15.5M8.5 14H13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Practice</span>
      </span>
      <span class="tab-item is-disabled">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 19.5V13M12 19.5V7.5M19 19.5V10.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Results</span>
      </span>
    </nav>

  </div>

  <script src="js/data.js"></script>
  <script>
    // Read ?subject=xxx from the URL and render that subject's chapters.
    const params = new URLSearchParams(window.location.search);
    const subjectKey = params.get("subject");
    const subject = SUBJECTS[subjectKey];
    const content = document.getElementById("appContent");

    if (subject) {
      document.getElementById("subjectTitle").textContent = subject.name;
      document.getElementById("subjectTagline").textContent = subject.tagline;
      document.title = subject.name + " — SSC Practice";

      let rowsHtml = "";
      subject.chapters.forEach((chapter, index) => {
        rowsHtml += `
          <a href="quiz.html?subject=${subjectKey}&chapter=${chapter.id}" class="chapter-row">
            <span class="chapter-num">${index + 1}</span>
            <span class="chapter-text">
              <span class="chapter-name">${chapter.name}</span>
              <span class="chapter-meta">${chapter.questionCount} questions</span>
            </span>
            <span class="chapter-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 6L15 12L9 18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </a>
        `;
      });

      content.innerHTML = `
        <h2 class="section-title">Chapters</h2>
        <div class="chapter-list">${rowsHtml}</div>
        <p class="note"><strong>Note:</strong> chapter names shown are demo placeholders, not the real SSC curriculum yet.</p>
      `;
    } else {
      content.innerHTML = `
        <div class="not-found">
          <div class="app-bar-title" style="font-size:1rem;">Subject not found</div>
          <p>The subject you're looking for doesn't exist or the link is broken.</p>
          <a href="index.html">Back to home</a>
        </div>
      `;
    }
  </script>

</body>
</html>
