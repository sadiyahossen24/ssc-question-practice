<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SSC Prep</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="app-wrapper">
        <!-- Top App Bar & Profile Button -->
        <div class="app-header">
            <div class="user-greeting">
                <span class="greeting-sub">Welcome back,</span>
                <h1 id="user-name" class="greeting-name">Hello, Student 👋</h1>
                <div class="profile-tags">
                    <span id="user-batch" class="tag-badge">SSC 2026</span>
                    <span id="user-group" class="tag-badge group-badge">Science</span>
                </div>
            </div>
            <a href="/profile" class="profile-edit-btn">⚙️ Profile</a>
        </div>

        <hr class="divider">

        <!-- General Subjects Section -->
        <div class="section-title">
            <h3>📖 Compulsory Subjects</h3>
        </div>
        <div id="general-subject-list" class="subject-grid"></div>

        <!-- Group Subjects Section -->
        <div class="section-title" style="margin-top: 25px;">
            <h3>🎯 Group Subjects</h3>
        </div>
        <div id="group-subject-list" class="subject-grid"></div>
    </div>

    <!-- Script Links -->
    <script src="{{ url_for('static', filename='js/subjects.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
