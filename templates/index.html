<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SSC Exam Prep</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="app-wrapper">
        <!-- Top Header -->
        <div class="app-header">
            <div class="user-greeting">
                <h3 id="user-name-display">হ্যালো, শিক্ষার্থী 👋</h3>
                <p id="user-info-display">SSC 2025 • Science Group</p>
            </div>
            <a href="/profile" class="streak-badge" style="text-decoration: none; color: inherit;">
                ⚙️ প্রোফাইল
            </a>
        </div>

        <!-- Section Header -->
        <div class="section-title">
            <span>বিষয় নির্বাচন করো</span>
            <span class="badge" id="subject-count-tag">৩টি বিষয়</span>
        </div>

        <!-- Dynamic Subject List Container -->
        <div class="subject-list" id="subject-list-container">
            <!-- JavaScript will render subject cards dynamically -->
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <a href="/" class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Home</span>
            </a>
            <a href="/profile" class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Profile</span>
            </a>
        </div>
    </div>

    <!-- Linked External JS -->
    <script src="{{ url_for('static', filename='js/home.js') }}"></script>
</body>
</html>
