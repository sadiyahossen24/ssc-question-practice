<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparation Mode - SSC Prep</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="app-wrapper">
        <!-- Header Bar -->
        <div class="app-header">
            <a href="/" class="back-link">← Back to Dashboard</a>
            <div class="streak-badge">⚡ SSC Prep</div>
        </div>

        <div class="section-title">
            <h2 id="selected-subject-title">Loading Subject...</h2>
            <p style="color: #a0aec0; font-size: 13px;">প্রস্তুতির ধরন নির্বাচন করো</p>
        </div>

        <!-- Mode Selection Tabs (Chapter-wise vs Year-wise) -->
        <div class="type-selector">
            <button id="tab-chapter" class="type-btn active" onclick="switchType('chapter')">📖 Chapter Wise</button>
            <button id="tab-year" class="type-btn" onclick="switchType('year')">📅 Year Wise (Board)</button>
        </div>

        <!-- Dynamic List Container (Chapter or Year options will render here) -->
        <div id="item-list-container" class="chapter-container">
            <!-- Dynamic Items Load Here -->
        </div>
    </div>

 
    <!-- External JS Files -->
    <script src="{{ url_for('static', filename='js/subjects.js') }}"></script>
    <script src="{{ url_for('static', filename='js/questions.js') }}"></script> <!-- Ei line ta add korbe -->
    <script src="{{ url_for('static', filename='js/mode.js') }}"></script>
</body>
</html>
</body>
</html>
