<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Practice - SSC Prep</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="app-wrapper">
        <!-- Top Navigation -->
        <div class="app-header">
            <a href="javascript:history.back()" class="back-link">← Exit Quiz</a>
            <div id="quiz-timer" class="streak-badge">⚡ SSC Prep</div>
        </div>

        <!-- Quiz Progress Banner -->
        <div class="quiz-status">
            <span id="quiz-title">Quiz Mode</span>
            <span id="quiz-progress">Question 0/0</span>
        </div>

        <!-- Main Question Card -->
        <div id="quiz-card" class="quiz-card">
            <h3 id="question-text">প্রশ্ন লোড হচ্ছে...</h3>

            <!-- Options Container -->
            <div id="options-container" class="options-container">
                <!-- Dynamic Options Will Load Here -->
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="explanation-box" style="display: none;">
                <h4>💡 ব্যাখ্যা (Explanation):</h4>
                <p id="explanation-text"></p>
            </div>
        </div>

        <!-- Action Button -->
        <div class="quiz-controls" style="margin-top: 15px;">
            <button id="next-btn" onclick="nextQuestion()" class="btn-practice" style="display: none; width: 100%; padding: 12px;">পরবর্তী প্রশ্ন ➔</button>
        </div>
    </div>

    <!-- Linked JS Files -->
    <script src="{{ url_for('static', filename='js/subjects.js') }}"></script>
    <script src="{{ url_for('static', filename='js/questions.js') }}"></script>
    <script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
</body>
</html>
