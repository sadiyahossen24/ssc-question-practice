<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Exam - SSC Prep</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="app-wrapper">
        <!-- Top Header -->
        <div class="app-header">
            <a href="/" class="back-link" style="color: #ffde59; text-decoration: none; font-weight: bold;">✕ Exit</a>
            <div class="streak-badge">
                ⏱️ Exam Mode
            </div>
        </div>

        <!-- Question Container -->
        <div class="quiz-container">
            <div class="quiz-progress-text" id="quiz-progress">Loading...</div>
            
            <h2 class="question-text" id="question-title">
                প্রশ্ন লোড হচ্ছে...
            </h2>

            <!-- Options Container -->
            <div class="options-container" id="options-box">
                <!-- Options JS theke dynamic bhabe ashbe -->
            </div>

            <!-- Explanation Box (Hidden by default) -->
            <div id="explanation-box" class="explanation-box" style="display: none; margin-top: 15px;">
                <h4>💡 ব্যাখ্যা:</h4>
                <p id="explanation-text"></p>
            </div>
        </div>

        <!-- Action Button / Footer -->
        <div class="quiz-footer">
            <button class="submit-btn" id="next-btn" style="display: none; margin-top: 15px;">পরবর্তী প্রশ্ন →</button>
        </div>
    </div>

<script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
</body>
</html>
